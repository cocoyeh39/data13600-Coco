<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>New Lecture</title></head>
<body>
    <h1>New Lecture</h1>
    <form action="/app/createLecture" method="post">
        <p>
            <label>Course:
                <select name="choice" required>
                    {% for c in courses %}
                    <option value="{{ c.coursename }}">{{ c.coursename }}</option>
                    {% endfor %}
                </select>
            </label>
        </p>
        <button type="submit">Create Lecture</button>
    </form>
</body>
</html>
